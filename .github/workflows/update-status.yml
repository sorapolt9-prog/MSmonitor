name: Update M365 Status JSON

on:
  schedule:
    - cron: '*/10 * * * *' # รันอัตโนมัติทุก 10 นาที (ลดการชนกันของ GitHub Pages Deploy)
  workflow_dispatch:       # เปิดปุ่มให้กด Run workflow เองได้ทันที

permissions:
  contents: write

concurrency:
  group: update-m365-status-json
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch @MSFT365Status (Posts & Replies) and Cloud RSS
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");

          function cleanHtml(raw) {
            if (!raw) return "";
            return raw
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, "\"")
              .replace(/&#39;/g, "\x27")
              .replace(/<br\s*\/?>/gi, " ")
              .replace(/<\/div>/gi, " ")
              .replace(/<[^>]*>?/gm, " ")
              .replace(/&nbsp;/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          async function fetchFromX(bearerToken) {
            const items = [];
            if (!bearerToken) {
              console.warn("⚠️ X_BEARER_TOKEN secret is empty or not configured.");
              return items;
            }

            const token = bearerToken.trim();
            const headers = {
              "Authorization": `Bearer ${token}`,
              "User-Agent": "MSMonitor-GitHubActions/1.0"
            };

            // 1. ค้นหา User ID ของ @MSFT365Status
            const userRes = await fetch("https://api.x.com/2/users/by/username/MSFT365Status", { headers });
            const userData = await userRes.json();

            if (!userRes.ok || !userData.data?.id) {
              console.error("❌ X User Lookup Failed:", userRes.status, JSON.stringify(userData));
              return items;
            }

            const userId = userData.data.id;
            console.log(`✅ Resolved @MSFT365Status User ID: ${userId}`);

            // 2. ดึงโพสต์ล่าสุดและ Replies (ไม่ระบุ exclude=replies เพื่อให้ได้ทั้งโพสต์หลักและ Reply)
            const tweetsUrl = `https://api.x.com/2/users/${userId}/tweets?max_results=15&exclude=retweets&tweet.fields=created_at,in_reply_to_user_id,conversation_id`;
            const tweetsRes = await fetch(tweetsUrl, { headers });
            const tweetsData = await tweetsRes.json();

            if (!tweetsRes.ok) {
              console.error("❌ X Tweets Fetch Failed:", tweetsRes.status, JSON.stringify(tweetsData));
              return items;
            }

            if (Array.isArray(tweetsData.data)) {
              for (const tweet of tweetsData.data) {
                const isReply = Boolean(tweet.in_reply_to_user_id) || tweet.text.trim().startsWith("@");
                items.push({
                  title: isReply ? "@MSFT365Status (Reply)" : "@MSFT365Status",
                  description: tweet.text.trim(),
                  pubDate: tweet.created_at,
                  link: `https://x.com/MSFT365Status/status/${tweet.id}`,
                  source: isReply ? "@MSFT365Status (Reply)" : "@MSFT365Status"
                });
              }
              console.log(`✅ Fetched ${items.length} items (including replies) from X API.`);
            }
            return items;
          }

          async function fetchFromMicrosoftRss() {
            const items = [];
            try {
              const resMac = await fetch("https://status.cloud.microsoft/api/feed/mac");
              if (!resMac.ok) {
                console.warn("⚠️ MAC RSS returned HTTP", resMac.status);
                return items;
              }
              const xml = await resMac.text();
              const blocks = xml.match(/<item>[\s\S]*?<\/item>/g) || [];
              for (const b of blocks.slice(0, 5)) {
                const rawTitle = b.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/)?.[1] || b.match(/<title>([\s\S]*?)<\/title>/)?.[1] || "";
                const rawDesc = b.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/)?.[1] || b.match(/<description>([\s\S]*?)<\/description>/)?.[1] || "";
                const pubDate = (b.match(/<pubDate>([\s\S]*?)<\/pubDate>/)?.[1] || "").trim();

                items.push({
                  title: cleanHtml(rawTitle) || "Microsoft 365 Status",
                  description: cleanHtml(rawDesc),
                  pubDate,
                  link: "https://status.cloud.microsoft/",
                  source: "status.cloud.microsoft"
                });
              }
              console.log(`✅ Fetched ${items.length} items from status.cloud.microsoft RSS.`);
            } catch (e) {
              console.error("❌ MAC RSS Error:", e.message);
            }
            return items;
          }

          async function main() {
            const [xItems, macItems] = await Promise.all([
              fetchFromX(process.env.X_BEARER_TOKEN),
              fetchFromMicrosoftRss()
            ]);

            const allItems = [...xItems, ...macItems];
            allItems.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

            const payload = {
              updatedAt: new Date().toISOString(),
              source: xItems.length > 0
                ? "Authenticated X API (@MSFT365Status + Replies) & Microsoft Cloud Status"
                : "Microsoft 365 Cloud Status Feed",
              count: allItems.length,
              items: allItems.slice(0, 20)
            };

            fs.writeFileSync("status.json", JSON.stringify(payload, null, 2));
            console.log(`💾 Wrote status.json successfully (${payload.count} total items).`);
          }

          main();
          '

      - name: Commit and push updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update status.json with X API & Cloud Status"
          git push
