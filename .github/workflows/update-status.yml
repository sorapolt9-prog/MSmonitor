name: Update M365 Status JSON

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-m365-status-json
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch M365 Status & @MSFT365Status Replies (Rollback to Free RSS Bridges)
        run: |
          node -e '
          const fs = require("fs");

          function cleanHtml(raw) {
            if (!raw) return "";
            return raw
              .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&")
              .replace(/<br\s*\/?>/gi, " ").replace(/<\/div>/gi, " ")
              .replace(/<[^>]*>?/gm, " ").replace(/&nbsp;/g, " ")
              .replace(/\s+/g, " ").trim();
          }

          function parseRssItems(xml, sourceLabel) {
            const items = [];
            const itemBlocks = xml.match(/<item>[\s\S]*?<\/item>/g) || [];
            for (const block of itemBlocks.slice(0, 10)) {
              const rawTitle = block.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/)?.[1] || block.match(/<title>([\s\S]*?)<\/title>/)?.[1] || "";
              const rawDesc = block.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/)?.[1] || block.match(/<description>([\s\S]*?)<\/description>/)?.[1] || "";
              const link = (block.match(/<link>([\s\S]*?)<\/link>/)?.[1] || "").trim();
              const pubDate = (block.match(/<pubDate>([\s\S]*?)<\/pubDate>/)?.[1] || "").trim();

              const title = cleanHtml(rawTitle);
              const desc = cleanHtml(rawDesc);
              const isReply = title.startsWith("Re:") || title.startsWith("@") || desc.startsWith("@");

              items.push({
                title: isReply ? "@MSFT365Status (Reply)" : (title || sourceLabel),
                description: desc || title,
                pubDate,
                link: link || "https://x.com/MSFT365Status/with_replies",
                source: isReply ? "@MSFT365Status (Reply)" : sourceLabel
              });
            }
            return items;
          }

          async function main() {
            const allItems = [];

            // 1. ดึงจาก Microsoft 365 Cloud Status Official RSS
            try {
              const resMac = await fetch("https://status.cloud.microsoft/api/feed/mac");
              if (resMac.ok) {
                const xmlMac = await resMac.text();
                allItems.push(...parseRssItems(xmlMac, "status.cloud.microsoft"));
              }
            } catch (e) { console.error("MAC RSS failed:", e.message); }

            // 2. ดึงจาก @MSFT365Status (รวม Replies) ผ่าน RSS Bridges ฟรี
            const xBridges = [
              "https://rsshub.app/twitter/user/MSFT365Status/includeRts=0&excludeReplies=0",
              "https://nitter.net/MSFT365Status/with_replies/rss",
              "https://nitter.privacydev.net/MSFT365Status/with_replies/rss"
            ];

            for (const url of xBridges) {
              try {
                const resX = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0 MSMonitor-Bot" } });
                if (resX.ok) {
                  const xmlX = await resX.text();
                  const parsedX = parseRssItems(xmlX, "@MSFT365Status");
                  if (parsedX.length > 0) {
                    allItems.push(...parsedX);
                    break;
                  }
                }
              } catch (e) { console.error("X Bridge failed:", url, e.message); }
            }

            // เรียงลำดับจากใหม่ไปเก่า
            allItems.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

            const payload = {
              updatedAt: new Date().toISOString(),
              source: "Microsoft 365 Cloud Status + @MSFT365Status (RSS Bridges)",
              count: allItems.length,
              items: allItems.slice(0, 15)
            };

            fs.writeFileSync("status.json", JSON.stringify(payload, null, 2));
            console.log("Saved status.json with", payload.count, "items.");
          }
          main();
          '

      - name: Commit and push updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: rollback to free RSS bridge sync"
          git push
